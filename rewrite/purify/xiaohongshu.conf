#############################################



# 惊喜弹窗
^https?:\/\/edith\.(xiaohongshu|rnote)\.com\/api\/sns\/v\d+\/surprisebox\/(get_style|open|submit_action) url reject-dict
^https?:\/\/www\.(xiaohongshu|rnote)\.com\/api\/marketing\/box\/trigger\? url reject-dict
# 信息流
^https?:\/\/edith\.(xiaohongshu|rnote)\.com\/api\/sns\/v\d+\/note\/guide\? url reject-dict
^https?:\/\/edith\.(xiaohongshu|rnote)\.com\/api\/sns\/v\d+\/note\/detailfeed\/preload\? url reject-dict
^https?:\/\/edith\.(xiaohongshu|rnote)\.com\/api\/sns\/v\d+\/guide\/user_banner url reject-dict
^https?:\/\/www\.(xiaohongshu|rnote)\.com\/api\/sns\/(v\d+\/ads\/resource|v\d+\/hey\/\w+\/hey_gallery) url reject-dict
# 搜索页
^https?:\/\/edith\.(xiaohongshu|rnote)\.com\/api\/sns\/v\d+\/search\/(banner_list|hot_list) url script-response-body https://raw.githubusercontent.com/Steeefanie/QuantumultX-resources/main/scripts/fmz200/xiaohongshu/xiaohongshu.js
^https?:\/\/edith\.(xiaohongshu|rnote)\.com\/api\/sns\/v\d+\/search\/(hint|trending)\? url script-response-body https://raw.githubusercontent.com/Steeefanie/QuantumultX-resources/main/scripts/fmz200/xiaohongshu/xiaohongshu.js
^https?:\/\/(so|edith)\.(xiaohongshu|rnote)\.com\/api\/sns\/v\d+\/search\/notes\? url script-response-body https://raw.githubusercontent.com/Steeefanie/QuantumultX-resources/main/scripts/fmz200/xiaohongshu/xiaohongshu.js
# 开屏广告
^https?:\/\/edith\.(xiaohongshu|rnote)\.com\/api\/sns\/v\d+\/system_service\/config\? url script-response-body https://raw.githubusercontent.com/Steeefanie/QuantumultX-resources/main/scripts/fmz200/xiaohongshu/xiaohongshu.js
^https?:\/\/edith\.(xiaohongshu|rnote)\.com\/api\/sns\/v\d+\/system_service\/splash_config url script-response-body https://raw.githubusercontent.com/Steeefanie/QuantumultX-resources/main/scripts/fmz200/xiaohongshu/xiaohongshu.js
# 详情页,小部件
^https?:\/\/edith\.(xiaohongshu|rnote)\.com\/api\/sns\/v\d+\/note\/widgets url script-response-body https://raw.githubusercontent.com/Steeefanie/QuantumultX-resources/main/scripts/fmz200/xiaohongshu/xiaohongshu.js
#^https?:\/\/edith\.(xiaohongshu|rnote)\.com\/api\/sns\/v\d+\/user\/followings\/followfeed url script-response-body https://github.com/fmz200/wool_scripts/raw/main/Scripts/xiaohongshu/xiaohongshu.js
#^https?:\/\/edith\.(xiaohongshu|rnote)\.com\/api\/sns\/v\d+\/recommend\/user\/follow_recommend\? url script-response-body https://github.com/fmz200/wool_scripts/raw/main/Scripts/xiaohongshu/xiaohongshu.js
# 图片水印,视频水印
^https?:\/\/(edith|rec|www)\.(xiaohongshu|rnote)\.com\/api\/sns\/v\d+\/note\/(imagefeed|live_photo\/save) url script-response-body https://raw.githubusercontent.com/Steeefanie/QuantumultX-resources/main/scripts/fmz200/xiaohongshu/xiaohongshu.js
^https?:\/\/(edith|rec|www)\.(xiaohongshu|rnote)\.com\/api\/sns\/v\d+\/(followfeed|homefeed)\? url script-response-body https://raw.githubusercontent.com/Steeefanie/QuantumultX-resources/main/scripts/fmz200/xiaohongshu/xiaohongshu.js
^https?:\/\/(edith|rec|www)\.(xiaohongshu|rnote)\.com\/api\/sns\/(v2\/note\/feed|v3\/note\/videofeed)\? url script-response-body https://raw.githubusercontent.com/Steeefanie/QuantumultX-resources/main/scripts/fmz200/xiaohongshu/xiaohongshu.js
^https?:\/\/(edith|rec|www)\.(xiaohongshu|rnote)\.com\/api\/sns\/(v4\/note\/videofeed|v10\/note\/video\/save)\? url script-response-body https://raw.githubusercontent.com/Steeefanie/QuantumultX-resources/main/scripts/fmz200/xiaohongshu/xiaohongshu.js
# 评论区用户id置空 (实验功能可能无效)
^https?:\/\/edith\.(xiaohongshu|rnote)\.com\/api\/sns\/v\d\/note\/comment\/list url response-body red_id response-body fmz200
# 评论区图片水印 (实验功能可能无效)
^https?:\/\/ci\.(xiaohongshu|rnote)\.com\/system_config\/watermark url reject-img

hostname = edith.xiaohongshu.com, www.xiaohongshu.com, ci.xiaohongshu.com, rec.xiaohongshu.com, edith.rnote.com, www.rnote.com, ci.rnote.com, so.rnote.com, rec.rnote.com
