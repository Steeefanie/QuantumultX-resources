# 名称：百度贴吧 App 深度净化
# 用途：处理开屏、帖子列表、详情、看图模式及部分广告配置字段。 / 处理匹配二进制接口中的帖子列表、详情及广告相关字段。
# 本地整理日期：2026-11-04；来源版本固定，不是实时同步。
# 原作者与来源：https://github.com/app2smile/rules/blob/df6366a7024e0b3f0aa3510c5b791eea6f3cba89/module/tieba-qx.conf
# 许可：MIT，原始版权及完整许可见 rewrite/licenses/app2smile-MIT.txt。
# 本地修改：保留原重写正文，仅把直接脚本依赖改为本仓库完整脚本地址。
# 状态：未完成真实设备业务验证；具体 App 版本、iOS 要求与功能限制见上游原文。
# 贴吧去广告-qx(>=iOS15)
# qx加载本重写前,须同时加载对应的贴吧分流,否则不能完全去广告
# 仓库地址 https://github.com/app2smile/rules
# 开屏广告;推荐和吧内帖子列表的直播及广告;详情页直播/关联商品/广告;看图模式广告;首页和帖子详情页右下角悬浮广告;部分吧内的置顶/最新中间的广告/head图片广告/head直播

hostname = tiebac.baidu.com
^https?:\/\/(tiebac|c\.tieba)\.baidu\.com\/(c\/(s\/sync|f\/(ad\/getSplashAd|frs\/(page|threadlist|generalTabList)|pb\/(pic)?page|excellent\/personalized))$|tiebaads\/commonbatch\?) url script-response-body https://raw.githubusercontent.com/Steeefanie/QuantumultX-resources/main/scripts/app2smile/tieba-json.js
^https?:\/\/(tiebac|c\.tieba)\.baidu\.com\/c\/(b\/ad\/adBid|f\/(frs\/(page|threadlist|generalTabList)|ad\/getFeedAd|pb\/page|excellent\/personalized))\?cmd url script-response-body https://raw.githubusercontent.com/Steeefanie/QuantumultX-resources/main/scripts/app2smile/tieba-proto.js
