# 名称：哔哩哔哩 App 深度净化
# 用途：处理开屏、首页推荐及部分导航字段，过滤源代码列出的广告卡片或推广入口。 / 解码并重编码匹配的二进制协议响应，处理动态、视频详情等接口中的广告与推广字段。
# 本地整理日期：2026-11-04；来源版本固定，不是实时同步。
# 原作者与来源：https://github.com/app2smile/rules/blob/df6366a7024e0b3f0aa3510c5b791eea6f3cba89/module/bilibili-qx.conf
# 许可：MIT，原始版权及完整许可见 rewrite/licenses/app2smile-MIT.txt。
# 本地修改：保留原重写正文，仅把直接脚本依赖改为本仓库完整脚本地址。
# 状态：未完成真实设备业务验证；具体 App 版本、iOS 要求与功能限制见上游原文。
# bilibili去广告8.13(>=iOS15)
# 仓库地址 https://github.com/app2smile/rules
# 开屏页广告,推荐页广告,动态(最常访问/推荐话题/列表广告),视频播放页面(up主推荐广告)
hostname = app.bilibili.com, grpc.biliapi.net
^https:\/\/app\.bilibili\.com\/x\/(v2\/(splash\/(list|show)|feed\/index\?)|resource\/show\/tab\/v2) url script-response-body https://raw.githubusercontent.com/Steeefanie/QuantumultX-resources/main/scripts/app2smile/bilibili-json.js
^https:\/\/(grpc\.biliapi\.net|app\.bilibili\.com)\/bilibili\.app\.(viewunite\.v1\.View\/View|dynamic\.v2\.Dynamic\/DynAll)$ url script-response-body https://raw.githubusercontent.com/Steeefanie/QuantumultX-resources/main/scripts/app2smile/bilibili-proto.js
