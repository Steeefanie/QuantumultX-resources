# 名称：微博客户端深度净化 @ddgksf2013
# 用途：清理微博客户端时间流、卡片列表、搜索结果及开屏接口中的广告与推广内容。
# 本地整理日期：2026-11-04
# 来源：https://github.com/ddgksf2013/Rewrite/raw/master/AdBlock/Weibo.conf
# 许可：GPL-3.0；完整许可见 rewrite/licenses/fmz200-GPL-3.0.txt，不改为根目录 MIT。
# 本地修改：参考 @ddgksf2013 Weibo.conf 接口范围整理，脚本地址指向本仓库 scripts/fmz200/weibo.js。
# 收录状态：配置及直接依赖已收录；隔离行号：无。
# 尚未完成真实设备验证，不承诺所有 App 版本可用或与其他来源模块等效。
#!name=微博客户端深度净化
#!desc=去除微博客户端开屏广告、信息流推广微博、热搜广告与超话横幅
#!author=ddgksf2013
#!homepage=https://github.com/Steeefanie/QuantumultX-resources

^https?:\/\/m?api\.weibo\.c(n|om)\/2\/(statuses\/(unread|friends|hot|container)_timeline|statuses\/extend|cardlist|searchall|page|profile\/statuses|groups\/timeline) url script-response-body https://raw.githubusercontent.com/Steeefanie/QuantumultX-resources/main/scripts/fmz200/weibo.js
^https?:\/\/sdkapp\.uve\.weibo\.com\/interface\/sdk\/sdkad\.php url reject-dict
^https?:\/\/wbapp\.uve\.weibo\.com\/wbapplua\/wbpullad\.lua url reject-dict

hostname = api.weibo.cn, mapi.weibo.com, sdkapp.uve.weibo.com, wbapp.uve.weibo.com
