# 名称：起点读书 App 深度净化
# 用途：处理起点阅读匹配接口中的开屏、活动入口、书架及书城推广字段。
# 本地整理日期：2026-11-04；来源版本固定，不是实时同步。
# 原作者与来源：https://github.com/app2smile/rules/blob/df6366a7024e0b3f0aa3510c5b791eea6f3cba89/module/qidian.conf
# 许可：MIT，原始版权及完整许可见 rewrite/licenses/app2smile-MIT.txt。
# 本地修改：保留原重写正文，仅把直接脚本依赖改为本仓库完整脚本地址。
# 状态：未完成真实设备业务验证；具体 App 版本、iOS 要求与功能限制见上游原文。
#  起点App去广告
# 仓库地址 https://github.com/app2smile/rules
# 需要qx保持全程开启状态,如果去广告无效,请点开插件链接查看解决办法
#   目前支持:
#       开屏页广告,每日导读去除(需全新应用),冷启动强制跳转精选页去除,去除发现页弹出的活动弹窗,
#       去除下方(精选 发现 中间的)活动时的tab,去除书架右下角的活动/广告的悬浮icon,搜索页可以搜索用户

#   无法去广告的解决办法:
#       开启代理软件的情况下,删除起点app,重新下载安装使用
#       原因:(因起点版本更新,原https接口会走tcp链接, 若在使用起点App的过程中代理软件没有始终开启,容易出现起点去广告失效的情况)

hostname = magev6.if.qidian.com
^https:\/\/magev6\.if\.qidian\.com\/argus\/api\/(v4\/client\/getsplashscreen|v2\/(deeplink\/geturl|dailyrecommend\/getdailyrecommend)|v1\/(client\/getconf$|bookshelf\/getHoverAdv|adv\/getadvlistbatch\?positions=iOS_tab)) url script-response-body https://raw.githubusercontent.com/Steeefanie/QuantumultX-resources/main/scripts/app2smile/qidian.js
