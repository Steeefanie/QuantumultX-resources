# 名称：微信公众号文章净化
# 用途：处理公众号文章下方广告、微信公众号去除商品推广等原文列出的接口。
# 本地整理日期：2026-11-04
# 来源：https://github.com/fmz200/wool_scripts/blob/4d349828f8b28862791243fb5319d47aa9c06403/QuantumultX/rewrite/split/partW/WeChatOfficialAccount.snippet
# 许可：GPL-3.0；完整许可见 rewrite/licenses/fmz200-GPL-3.0.txt，不改为根目录 MIT。
# 本地修改：在 fmz200/wool_scripts@4d349828 原文基础上，结合 yfamily/wechatad.conf 改为调用 wechat.js 并补充 wxs.qq.com 与 as.weixin.qq.com 分流拦截。
# 收录状态：配置及直接依赖已收录；隔离行号：无。
# 尚未完成真实设备验证，不承诺所有 App 版本可用或与其他来源模块等效。
#!name=微信公众号
#!desc=某些APP要清除缓存或者重新安装拦截广告才会生效！
#!author=奶思
#!homepage=https://github.com/fmz200/wool_scripts
#!icon=https://raw.githubusercontent.com/Steeefanie/QuantumultX-resources/main/icon/Global.png
#!raw-url=https://raw.githubusercontent.com/Steeefanie/QuantumultX-resources/main/rewrite/purify/wechat-mp.conf
#!tg-group=https://t.me/QuantumultXCommunity
#!date=2026-11-04
#############################################



# 公众号文章底部与文中嵌入式广告
^https?:\/\/mp\.weixin\.qq\.com\/mp\/getappmsgad url script-response-body https://raw.githubusercontent.com/Steeefanie/QuantumultX-resources/main/scripts/fmz200/wechat.js
# 微信公众号文章底部商品推广卡片
^https?:\/\/mp\.weixin\.qq\.com\/mp\/cps_product_info url reject-dict
# 微信公众号文章内关联搜索词广告
^https?:\/\/mp\.weixin\.qq\.com\/mp\/relatedsearchword url reject-dict
# 微信朋友圈与公众号动态视频推广流
^https?:\/\/wxsnsdy\.wxs\.qq\.com url reject-200
^https?:\/\/wxsnsdythumb\.wxs\.qq\.com url reject-200

hostname = mp.weixin.qq.com, wxsnsdy.wxs.qq.com, wxsnsdythumb.wxs.qq.com
