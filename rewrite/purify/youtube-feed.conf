# 名称：YouTube 首页与推荐列表净化
# 用途：处理 browse / next 协议响应中的首页信息流和播放页推荐广告条目。
# 本地整理日期：2026-11-04；来源版本固定，不是实时同步。
# 原作者与来源：https://github.com/app2smile/rules/blob/df6366a7024e0b3f0aa3510c5b791eea6f3cba89/module/youtube-qx.conf
# 许可：MIT，原始版权及完整许可见 rewrite/licenses/app2smile-MIT.txt。
# 本地修改：保留原重写正文，仅把直接脚本依赖改为本仓库完整脚本地址。
# 状态：未完成真实设备业务验证；具体 App 版本、iOS 要求与功能限制见上游原文。
# YouTube去广告-qx(>=iOS15)
# 去首页瀑布流广告/播放页推荐列表广告(非贴片广告)
# 仓库地址 https://github.com/app2smile/rules

hostname = youtubei.googleapis.com
^https:\/\/youtubei\.googleapis\.com\/youtubei\/v1\/(browse|next) url script-response-body https://raw.githubusercontent.com/Steeefanie/QuantumultX-resources/main/scripts/app2smile/youtube.js
