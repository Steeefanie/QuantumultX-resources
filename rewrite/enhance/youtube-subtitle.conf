# 名称：油管字幕自动中译 @id77
# 用途：匹配 YouTube timedtext 外文字幕请求并自动机翻为简体中文（tlang=zh-Hans）。
# 本地整理日期：2026-11-04
# 来源：https://github.com/fmz200/wool_scripts/blob/4b7830670baf235ed945085cb926dc499cf619e0/QuantumultX/rewrite/split/partY/YoutubeCC.snippet
# 许可：GPL-3.0；完整许可见 rewrite/licenses/fmz200-GPL-3.0.txt，不改为根目录 MIT。
# 本地修改：分离配套分流，直接脚本地址改为本仓库；保留原作者署名。
# 收录状态：配置及直接依赖已收录；隔离行号：无。
# 尚未完成真实设备验证，不承诺所有 App 版本可用或与其他来源模块等效。
# QX Youtube 无中文字幕机翻方案（默认简体中文 zh-Hans，无需开启资源解析器）
# 原作者：id77 (https://github.com/id77/QuantumultX)

hostname = www.youtube.com

# 简体中文自动翻译
https:\/\/www.youtube.com\/api\/timedtext\?.+&lang=(?!(zh|zh\-Hans)&)((?!&tlang=zh\-Hans).)*$ url request-header \sHTTP/1\.1(\r\n) request-header &tlang=zh-Hans HTTP/1.1$1

# 如需繁体中文，可注释上方简体行并取消下方注释：
# https:\/\/www.youtube.com\/api\/timedtext\?.+&lang=(?!zh\-Hant&)((?!&tlang=zh\-Hant).)*$ url request-header \sHTTP/1\.1(\r\n) request-header &tlang=zh-Hant HTTP/1.1$1
