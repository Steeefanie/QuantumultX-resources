# 名称：Spotify VIP 解锁与净化
# 用途：移除匹配请求中的 If-None-Match 缓存校验头，让对应接口重新返回响应内容。 / 解码并重编码匹配的协议响应，调整广告、播放行为及部分客户端账户属性字段。 / 将匹配请求中的 platform=iphone 改为 platform=ipad，并处理主机名后的 :443 写法。
# 本地整理日期：2026-11-04；来源版本固定，不是实时同步。
# 原作者与来源：https://github.com/app2smile/rules/blob/df6366a7024e0b3f0aa3510c5b791eea6f3cba89/module/spotify.conf
# 许可：MIT，原始版权及完整许可见 rewrite/licenses/app2smile-MIT.txt。
# 本地修改：保留原重写正文，仅把直接脚本依赖改为本仓库完整脚本地址。
# 状态：未完成真实设备业务验证；具体 App 版本、iOS 要求与功能限制见上游原文。
# 2025.6.27 部分解锁premium,音质不能设置为超高(建议登录后再打开脚本,重启app等待脚本生效)
# 仓库地址 https://github.com/app2smile/rules
# 功能: 1.去除播放广告 2.歌手/专辑列表正常展示 3.去除随机播放
hostname = spclient.wg.spotify.com, *spclient.spotify.com
^https:\/\/(spclient\.wg\.spotify\.com|.*-spclient\.spotify\.com(:443)?)\/user-customization-service\/v1\/customize$ url script-request-header https://raw.githubusercontent.com/Steeefanie/QuantumultX-resources/main/scripts/app2smile/spotify-qx-header.js
^https:\/\/(spclient\.wg\.spotify\.com|.*-spclient\.spotify\.com(:443)?)\/(bootstrap\/v1\/bootstrap|user-customization-service\/v1\/customize)$ url script-response-body https://raw.githubusercontent.com/Steeefanie/QuantumultX-resources/main/scripts/app2smile/spotify-proto.js
^https:\/\/(spclient\.wg\.spotify\.com|.*-spclient\.spotify\.com(:443)?)\/(artistview\/v1\/artist|album-entity-view\/v2\/album)\/ url script-request-header https://raw.githubusercontent.com/Steeefanie/QuantumultX-resources/main/scripts/app2smile/spotify-json.js
