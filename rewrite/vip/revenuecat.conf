# 本地修改：分离配套分流，直接脚本地址改为本仓库；保留原作者署名。
# 收录状态：配置及直接依赖已收录；隔离行号：无。
# 尚未完成真实设备验证，不承诺所有 App 版本可用或与其他来源模块等效。
#!name=RevenueCat 通用内购 VIP 解锁
#!desc=支持 No Fusion、Notability、Goodnotes、Locket、VSCO、Darkroom、PhotoRoom 等基于 RevenueCat 的订阅制应用
#!author=Yu9191 & Steeefanie
#!homepage=https://github.com/Steeefanie/QuantumultX-resources

^https?:\/\/api\.(revenuecat|rc-backup)\.com\/.+\/(receipts$|subscribers\/[^/]+$) url script-response-body https://raw.githubusercontent.com/Steeefanie/QuantumultX-resources/main/scripts/fmz200/revenuecat.js
^https?:\/\/api\.(revenuecat|rc-backup)\.com\/.+\/(receipts$|subscribers\/[^/]+$) url script-request-header https://raw.githubusercontent.com/Steeefanie/QuantumultX-resources/main/scripts/fmz200/revenuecat.js

hostname = api.revenuecat.com, api.rc-backup.com
