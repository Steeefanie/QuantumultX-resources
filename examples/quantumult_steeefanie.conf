[filter_remote]
# tag 为资源显示名；force-policy 覆盖该资源中全部规则的策略。
# update-interval=86400 为每天更新；opt-parser=false 为不经过资源解析器。
# enabled=true 代表默认启用，暂不需要的资源可改为 false；这与地区组是否定义相互独立。
# inserted-resource=true 用于插入资源规则；核对展开顺序，确保专用域名在 GeoIP / final 前匹配。
# 重写配套去广告拦截，放在宽泛业务规则之前。
https://raw.githubusercontent.com/Steeefanie/QuantumultX-resources/main/filter/adblock/combined.list, tag=重写配套去广告合集, force-policy=reject, inserted-resource=true, update-interval=86400, opt-parser=false, enabled=true
# 通用广告与跟踪域名拦截；放行特例已前置在 [filter_local] 中。
https://raw.githubusercontent.com/Steeefanie/QuantumultX-resources/main/filter/collections/advertising.list, tag=广告与跟踪, force-policy=reject, inserted-resource=true, update-interval=86400, opt-parser=false, enabled=true
# 个人服务：共用 Global；固定地区时改为 Hong Kong / Taiwan / Japan / Singapore / United States / South Korea 等已定义组。
https://raw.githubusercontent.com/Steeefanie/QuantumultX-resources/main/filter/services/openai.list, tag=OpenAI, force-policy=United States, inserted-resource=true, update-interval=86400, opt-parser=false, enabled=true
https://raw.githubusercontent.com/Steeefanie/QuantumultX-resources/main/filter/services/anthropic.list, tag=Anthropic, force-policy=United States, inserted-resource=true, update-interval=86400, opt-parser=false, enabled=true
