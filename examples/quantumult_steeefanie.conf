# Quantumult X 完整配置模板 · steeefanie
# 本地整理日期：2026-11-04（北京时间）；规则、重写、脚本与图标的独立许可见仓库 README。
# 写法参考用户提供的现有配置与 Quantumult X 官方示例，按本项目策略重新编写。
# 使用前：填入自己的 QX 格式订阅、检查地区候选节点，再启用所需分流资源。
# 模板不包含可用机场订阅或节点凭据；新规则与图标地址需本次发布后才可访问。
# 请先备份现有配置；完整模板导入会替换现有配置，保留配置时只合并所需段落。
# 模板更新日期：2026-11-04（北京时间）。
# 参数解释见 examples/config-guide.md；# 开头的行是注释，不参与运行。

[general]
# 节点延迟检测地址；测得的是请求响应时间，不等于下载带宽。
server_check_url = http://www.gstatic.com/generate_204
# 沿用原配置的节点检测阈值：3000 毫秒为 3 秒，不是所有连接的超时设置。
server_check_timeout = 3000
# 整份配置的显示图标；策略组各自的图标由 img-url 设置。
profile_img_url = https://raw.githubusercontent.com/Steeefanie/QuantumultX-resources/main/icon/Global.png
# 沿用原配置：关闭额外的 IP 地区查询入口。
geo_location_checker = disabled
# 沿用 Shawn 的资源解析器入口；本库原生 QX 规则继续使用 opt-parser=false。
# 其他受支持格式的节点订阅需要转换时，再为该资源设置 opt-parser=true。
resource_parser_url = https://raw.githubusercontent.com/Steeefanie/QuantumultX-resources/main/scripts/tools/resource-parser.js
# 固定版本及哈希见 sources/remote-resources.lock.json；上游变化只报告，不自动替换。
# 沿用原配置的兼容例外：停用这些域名的占位 IP 映射，不会把它们自动设为直连。
dns_exclusion_list = *.cmpassport.com, *.jegotrip.com.cn, *.icitymobile.mobi, id6.me, *.pingan.com.cn, *.cmbchina.com
# 沿用原配置：绕过 TUN 接管的局域网多播投屏（SSDP/UPnP）及特定直通路由。
excluded_routes = 239.255.255.250/32, 24.105.30.129/32, 185.60.112.157/32, 185.60.112.158/32, 182.162.132.1/32
# 沿用原配置：丢弃 UDP 443，其他 UDP 目标端口放行；可能影响 QUIC / HTTP/3。
udp_whitelist = 1-442, 444-65535
# 已由路由器处理代理的 Wi-Fi 可按需切换直连模式；先替换为真实 Wi-Fi 名称。
# running_mode_trigger = filter, filter, HOME_WIFI:all_direct, WORK_WIFI:all_direct

[dns]
# 域名查询服务器：把域名解析成 IP；不会凭此决定服务走哪个代理地区。
# 沿用原配置：不用系统 DNS，并停用 QX DNS 模块的 AAAA 查询。
no-ipv6
no-system
server = 223.5.5.5
server = 119.29.29.29
server = 114.114.114.114
server = /*.icloud.com/119.29.29.29
server = /*.icloud.com.cn/119.29.29.29
server = /*.tencent.com/119.29.29.29
server = /*.weixin.com/119.29.29.29
# 如需系统 DNS 或 IPv6 查询，分别注释对应的 no-system / no-ipv6 行。
# 普通 DNS 不加密；DoH 与随网络 DNS 的备选写法见 examples/config-guide.md。

[server_local]
# 如有手动节点，在本机添加；请勿把含密码的配置提交到仓库。

[server_remote]
# 在本机把示例地址换成机场提供的订阅链接，再移除行首 #。
# 设 opt-parser=true 时，资源解析器会自动转换格式并补充节点地区旗帜 Emoji：
# https://example.com/airport-a/sub, tag=Airport-A, update-interval=86400, opt-parser=true, enabled=true
# https://example.com/airport-b/sub, tag=Airport-B, update-interval=86400, opt-parser=true, enabled=true
# tag 是订阅名；update-interval 单位为秒；opt-parser 控制资源解析器；enabled 控制启用。

[policy]
static = Global, Hong Kong, Taiwan, Japan, Singapore, United States, proxy, direct, img-url=https://raw.githubusercontent.com/Steeefanie/QuantumultX-resources/main/icon/Global.png
# Global 对应原配置的“全球加速”总组（避免占用 Quantumult X 系统保留名 PROXY/proxy）。
# 默认使用香港，可随时手动改选地区；首次导入后确认 Global 已勾选 Hong Kong。
# Hong Kong 保留在首个候选；实际选中项以客户端界面为准，各地区内部自动按延迟择优。
# 分流资源可直接选 reject / direct / Global，也可直接指定 Hong Kong 等地区组。
# 检测间隔 check-interval=600、延迟容差 tolerance=20。
# 检测受策略活动状态影响，不保证故障发生时立即切换，也不验证所有业务可用性。
# 5 个地区默认全部定义，不保证空地区自动隐藏；没有候选的地区不要选择。
# 不需要某地区时，注释该地区行，并从 Global 中移除同名候选。
# 以下筛选默认跨所有已启用订阅。限定机场时，在地区行添加：
# resource-tag-regex=^(Airport-A|Airport-B)$
# Airport-A / Airport-B 必须与 [server_remote] 的 tag 一致。
# Hong Kong (HK)
url-latency-benchmark = Hong Kong, server-tag-regex=(?i)^(?!.*(?:流量|到期|剩余|重置|套餐|公告|traffic|expire|reset|quota|balance|(?<![a-z])beta(?![a-z]))).*(?:香港|hong[ _-]?kong|🇭🇰|(?<![a-z])hk(?![a-z])).*$, check-interval=600, tolerance=20, img-url=https://raw.githubusercontent.com/Steeefanie/QuantumultX-resources/main/icon/HongKong.png
# Taiwan (TW)
url-latency-benchmark = Taiwan, server-tag-regex=(?i)^(?!.*(?:流量|到期|剩余|重置|套餐|公告|traffic|expire|reset|quota|balance|(?<![a-z])beta(?![a-z]))).*(?:台湾|台灣|台北|臺北|台中|新北|高雄|彰化|hinet|cht|taiwan|taipei|🇹🇼|(?<![a-z])tw(?![a-z])).*$, check-interval=600, tolerance=20, img-url=https://raw.githubusercontent.com/Steeefanie/QuantumultX-resources/main/icon/Taiwan.png
# Japan (JP)
url-latency-benchmark = Japan, server-tag-regex=(?i)^(?!.*(?:流量|到期|剩余|重置|套餐|公告|traffic|expire|reset|quota|balance|(?<![a-z])beta(?![a-z]))).*(?:日本|东京|東京|大阪|japan|tokyo|osaka|🇯🇵|(?<![a-z])jp(?![a-z])).*$, check-interval=600, tolerance=20, img-url=https://raw.githubusercontent.com/Steeefanie/QuantumultX-resources/main/icon/Japan.png
# Singapore (SG)
url-latency-benchmark = Singapore, server-tag-regex=(?i)^(?!.*(?:流量|到期|剩余|重置|套餐|公告|traffic|expire|reset|quota|balance|(?<![a-z])beta(?![a-z]))).*(?:新加坡|狮城|獅城|singapore|🇸🇬|(?<![a-z])sg(?![a-z])).*$, check-interval=600, tolerance=20, img-url=https://raw.githubusercontent.com/Steeefanie/QuantumultX-resources/main/icon/Singapore.png
# United States (US)
url-latency-benchmark = United States, server-tag-regex=(?i)^(?!.*(?:流量|到期|剩余|重置|套餐|公告|traffic|expire|reset|quota|balance|(?<![a-z])beta(?![a-z]))).*(?:美国|美國|洛杉矶|洛杉磯|圣何塞|聖荷西|西雅图|西雅圖|纽约|紐約|united[ _-]?states|american?|los[ _-]?angeles|san[ _-]?jose|seattle|new[ _-]?york|🇺🇸|(?<![a-z])us(?![a-z])).*$, check-interval=600, tolerance=20, img-url=https://raw.githubusercontent.com/Steeefanie/QuantumultX-resources/main/icon/UnitedStates.png
