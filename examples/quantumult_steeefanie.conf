# 主配置中的国内直连、IP补充和final继续按实际需求管理。
# 每条资源的策略独立设置；同一请求匹配多个资源时，仍需检查实际匹配顺序。

# 通用域名后置兜底集合，置于专用业务之后；集合并非互补，也不覆盖全部网站。
https://raw.githubusercontent.com/Steeefanie/QuantumultX-resources/main/filter/collections/domestic.list, tag=国内域名, force-policy=direct, inserted-resource=true, update-interval=86400, opt-parser=false, enabled=true
https://raw.githubusercontent.com/Steeefanie/QuantumultX-resources/main/filter/collections/global.list, tag=海外域名, force-policy=Global, inserted-resource=true, update-interval=86400, opt-parser=false, enabled=true

[filter_local]
# 防广告域名一刀切拦截导致开屏卡死（放行连接交由重写层处理响应）：
host, ad.12306.cn, direct
host, gg.caixin.com, direct
host, sdkapp.uve.weibo.com, direct
# 确保本仓库托管的图标、分流与重写在远程规则首次拉取前即可经代理解析下载，避免国内 DNS 污染为 127.0.0.1 命中直连：
host-suffix, githubusercontent.com, Global
host-suffix, github.com, Global
# 拦截百度贴吧与阿里/B站 HTTPDNS 抢答，防止 App 绕过域名分流与去广告规则：
ip-cidr, 180.76.76.200/32, reject
ip-cidr, 203.107.1.1/24, reject
# 本地网络与 IP 补充。以客户端展开后的匹配顺序和实际请求记录为准。
# ip-cidr 为 IPv4 网段，ip6-cidr 为 IPv6 网段；direct 为直接连接。
ip-cidr, 10.0.0.0/8, direct
ip-cidr, 127.0.0.0/8, direct
ip-cidr, 169.254.0.0/16, direct
ip-cidr, 172.16.0.0/12, direct
ip-cidr, 192.168.0.0/16, direct
ip-cidr, 224.0.0.0/24, direct
ip-cidr, 182.254.116.0/24, direct
ip6-cidr, ::1/128, direct
ip6-cidr, fc00::/7, direct
ip6-cidr, fe80::/10, direct
# 依赖客户端当前 GeoIP 数据；不是对所有国内服务的覆盖承诺。
geoip, cn, direct
# 仍未命中其他规则的请求，最终交给 Global。
final, Global

[task_local]
# 沿用原配置的流媒体查询任务：在节点 / 策略交互菜单中手动触发，不后台定时巡检。
# 返回结果受平台接口变化影响；只是检测参考，不会自动切换地区或改变分流。
